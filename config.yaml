#SAM settings
tracker:
  sam_type: 'small' # tiny, small, or large
  sam_mask_threshold: 0
  sam_downcast_dtype: 'float16'
  image_height: 128
  image_width: 128
  px_size: 1.95
  prompt_library_path: '/utrecht_exp/logs/20260804T113453.160593/tracking_module/'
  connect_to_external_predictor: False
  prompt_delay: 50
  clipping: True
  clipping_min: 40 #SAG: 40
  clipping_max: 1000 #SAG: 1000

# LSTM settings
predictor:
  pred_type: 'lstm'
  lstm_model_path: '/utrecht_exp/all_arcs_all_sectors_raw_pretrained.pth'
  no_prediction: True
  connect_to_external_motion_estimation: False
  lookahead_time: 320 #ms
  framerate: 10
  lr: 1e-5
  epochs: 4



# Logging 
logging:
  folder: /utrecht_exp/logs/
  sam_log: True
  lstm_pred_log: True
  lstm_optimization_log: True
  gui_log: False
  debug: True
