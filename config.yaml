# Setting ports for data transfer
ports:
  # Trackers
  mrtc_port: 4005
  stack_update_host: '172.17.0.1'
  stack_update_port: 54323
  host_send_com: 'prediction_container_main'
  port_send_com: 9002
  host_send_com_to_extern: '0.0.0.0'
  port_send_com_to_extern: 1660 # & put in positionSensor: PositionServerPort=1660
  
  # Predictors
  host_receive_com: '0.0.0.0'
  port_receive_com: 9002
  port_receive_from_circle: 6055 # needs to be exposed & Port:6055, Type:PUB
  host_send_pred: '0.0.0.0'
  port_send_pred: 9003 

  # GUI
  host_gui: 'gui_container_main'
  port_gui_predictions: 7005
  port_gui_images: 7000
  port_gui_clicks: 8000
  port_gui_ext: 8502

