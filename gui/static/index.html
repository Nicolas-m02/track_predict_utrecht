"""
<!DOCTYPE html>
<html>
<head>
    <title>Streaming Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h2>Tracking Video Stream</h2>
    <img id="video" width="320" />

    <h2>Predictions</h2>
    <canvas id="chart"></canvas>

    <script>
        const ws = new WebSocket(`ws://${location.host}/ws`);

        const video = document.getElementById('video');


        // -----------------------------
        // CLICK HANDLING
        // -----------------------------
        video.addEventListener('click', (event) => {

            const rect = video.getBoundingClientRect();

            // Mouse position inside displayed image
            const displayX = event.clientX - rect.left;
            const displayY = event.clientY - rect.top;

            // Convert to ORIGINAL image coordinates
            // Original backend image = 128x128
            const x = Math.round(displayX * (128 / rect.width));
            const y = Math.round(displayY * (128 / rect.height));

            console.log("Clicked:", x, y);

            // Send click to backend
            ws.send(JSON.stringify({
                type: "click",
                x: x,
                y: y
            }));
        });

        const ctx = document.getElementById('chart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Predicted Value',
                    data: []
                }]
            }
        });

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // Update video
            video.src = 'data:image/jpeg;base64,' + data.frame;

            // Update chart
            chart.data.labels.push(data.t);
            chart.data.datasets[0].data.push(data.value);

            if (chart.data.labels.length > 200) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }

            chart.update('none'); // low latency
        };

    </script>
</body>
</html>
"""
